services:
  ollama:
    build: .
    container_name: caloriesguard-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_PRELOAD_MODEL: ${OLLAMA_PRELOAD_MODEL:-deepseek-r1:8b}
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: caloriesguard-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Keep the external env var name aligned with the legacy docker proxy.
      # The cloudflared image itself expects TUNNEL_TOKEN inside the container.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      ollama:
        condition: service_healthy
    profiles: ["prod"]

volumes:
  ollama_data:
    name: caloriesguard_ollama_data
